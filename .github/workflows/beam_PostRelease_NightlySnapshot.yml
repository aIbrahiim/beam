name: PostRelease Nightly Snapshot

on:
  workflow_dispatch:
    inputs:
      RELEASE:
        description: >-
          Beam version to validate (e.g. 2.73.0 for an RC). Leave empty to use the
          version from gradle.properties (nightly snapshot validation, same as schedule).
        required: false
        default: ''
      SNAPSHOT_URL:
        description: >-
          Maven repository URL. Leave empty for Apache snapshots (nightly, same as schedule).
          For RC validation use the staging repo (https://repository.apache.org/content/repositories/orgapachebeam-NNNN/).
        required: false
        default: 'https://repository.apache.org/content/repositories/snapshots/'
  schedule:
    - cron: '15 16 * * *'

#Setting explicit permissions for the action to avoid the default permissions which are `write-all` in case of pull_request_target event
permissions:
  actions: write
  pull-requests: read
  checks: read
  contents: read
  deployments: read
  id-token: none
  issues: read
  discussions: read
  packages: read
  pages: read
  repository-projects: read
  security-events: read
  statuses: read

env:
    DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
    GRADLE_ENTERPRISE_CACHE_USERNAME: ${{ secrets.GE_CACHE_USERNAME }}
    GRADLE_ENTERPRISE_CACHE_PASSWORD: ${{ secrets.GE_CACHE_PASSWORD }}
    # Same snapshot repo Beam publishes to (see BeamModulePlugin distMgmtSnapshotsUrl).
    APACHE_SNAPSHOT_REPO: ${{ github.event.inputs.SNAPSHOT_URL || 'https://repository.apache.org/content/repositories/snapshots/' }}

jobs:
  beam_PostRelease_NightlySnapshot:
    name: beam_PostRelease_NightlySnapshot
    runs-on: [self-hosted, ubuntu-20.04, highmem]
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup-environment-action
        with:
          java-version: default
      - name: Setup temp local maven
        id: setup_local_maven
        run: echo "NEW_TEMP_DIR=$(mktemp -d)" >> $GITHUB_OUTPUT
      - name: Set Beam version for validation
        id: beam_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ -n "${{ github.event.inputs.RELEASE }}" ]; then
            echo "VER_ARG=-Pver=${{ github.event.inputs.RELEASE }}" >> "$GITHUB_OUTPUT"
          else
            echo "VER_ARG=" >> "$GITHUB_OUTPUT"
          fi
      - name: run PostRelease validation script
        uses: ./.github/actions/gradle-command-self-hosted-action
        with:
          gradle-command: :release:runJavaExamplesValidationTask
          max-workers: 1
          arguments: |
            ${{ steps.beam_version.outputs.VER_ARG }}
            -Prepourl=${{ env.APACHE_SNAPSHOT_REPO }}
            -PmavenLocalPath=${{ steps.setup_local_maven.outputs.NEW_TEMP_DIR }}
      - name: Clean up local maven
        if: steps.setup_local_maven.outcome == 'success'
        run: rm -rf '${{ steps.setup_local_maven.outputs.NEW_TEMP_DIR }}'
